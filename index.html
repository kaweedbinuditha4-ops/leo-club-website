<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Leo Club | Anuradhapura Walisinghe Harishchandra College</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--yellow:#f7c928;--yellow2:#ffd84a;--black:#111214;--dark:#191a1e;--white:#fff;--bg:#f5f6f8;--text:#202124;--muted:#6d7178;--border:#e4e6eb;--green:#20a464;--red:#e14d5b;--shadow:0 18px 45px rgba(0,0,0,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:50;background:rgba(17,18,20,.96);backdrop-filter:blur(12px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.nav{max-width:1180px;margin:auto;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;white-space:nowrap}.brand span{color:var(--yellow)}
.brand small{display:block;color:#c8c8c8;font-size:10px;font-weight:600;letter-spacing:.4px}
.navlinks{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.navlinks button{background:transparent;border:0;color:#fff;padding:11px 14px;border-radius:10px;font-weight:700}.navlinks button:hover{background:#24262b;color:var(--yellow)}
.menu{display:none;background:#24262b;border:0;color:#fff;border-radius:10px;padding:9px 12px;font-size:20px}
.hero{min-height:650px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(247,201,40,.25),transparent 28%),linear-gradient(135deg,#0d0e10,#202329 60%,#111214);color:#fff}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.25}.hero:before{width:300px;height:300px;background:var(--yellow);right:-100px;top:-100px}.hero:after{width:220px;height:220px;background:#fff;left:-90px;bottom:-90px}
.hero-inner{max-width:1050px;padding:80px 20px;text-align:center;position:relative;z-index:1}.lion{font-size:76px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}
.badge{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:8px 14px;border-radius:999px;margin:20px 0 16px;color:#ddd;font-weight:700}
.hero h1{font-size:clamp(42px,7vw,78px);line-height:1.03;margin-bottom:18px}.hero h1 span{color:var(--yellow);display:block}.hero p{max-width:760px;margin:auto;color:#d5d7db;font-size:18px}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:900;background:var(--yellow);color:#111;box-shadow:0 10px 24px rgba(247,201,40,.22)}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#fff;color:#111}.btn.dark{background:#202227;color:#fff}.btn.danger{background:#ffe5e7;color:#a51f2c}.btn.small{padding:9px 13px;font-size:13px}
section{max-width:1180px;margin:auto;padding:80px 20px}.section-head{text-align:center;margin-bottom:35px}.section-head .eyebrow{color:#9b7a00;font-weight:900;text-transform:uppercase;letter-spacing:2px;font-size:12px}.section-head h2{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:7px 0}.section-head p{color:var(--muted);max-width:720px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:25px;box-shadow:var(--shadow)}.icon{font-size:38px;margin-bottom:12px}.card h3{margin-bottom:6px}.card p{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.statcard{background:var(--dark);color:#fff;border-radius:18px;padding:25px;text-align:center}.statcard strong{display:block;font-size:38px;color:var(--yellow);line-height:1.1}.statcard span{color:#c9cbd0}
.post-grid,.event-grid,.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.post-card,.event-card{background:#fff;border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06)}.post-card img,.event-card img{width:100%;height:200px;object-fit:cover;background:#eee}.post-body,.event-body{padding:20px}.post-body h3,.event-body h3{margin-bottom:7px}.meta{font-size:13px;color:var(--muted);margin-bottom:10px}.empty{text-align:center;color:var(--muted);padding:30px;background:#fff;border-radius:18px;border:1px dashed var(--border)}
.gallery-grid{grid-template-columns:repeat(4,1fr)}.gallery-item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.08)}.gallery-item img{width:100%;height:190px;object-fit:cover;display:block}
.join{background:linear-gradient(135deg,#17181b,#27292e);color:#fff;border-radius:28px;padding:55px 30px;text-align:center;box-shadow:var(--shadow)}.join h2{font-size:clamp(30px,5vw,48px)}.join p{color:#d4d5d8;max-width:700px;margin:10px auto}
footer{background:#111214;color:#ddd;padding:35px 20px;text-align:center}footer strong{color:var(--yellow)}footer small{display:block;color:#999;margin-top:6px}
.form-wrap{max-width:850px;margin:auto;background:#fff;border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:800}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d9dce2;background:#fbfcfd;border-radius:11px;padding:13px 14px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#caa500;box-shadow:0 0 0 3px rgba(247,201,40,.16)}textarea{min-height:120px;resize:vertical}.check{display:flex;gap:9px;align-items:flex-start}.check input{margin-top:5px}
.hidden{display:none!important}.page{min-height:60vh}.notice{padding:13px 15px;border-radius:12px;margin:15px 0;font-weight:700}.notice.error{background:#ffe8eb;color:#a21f2c}.notice.success{background:#e4f8ed;color:#116b42}
.login-box{max-width:520px;margin:40px auto;background:#fff;padding:32px;border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--border)}.login-box h2{margin-bottom:20px}.login-box input{width:100%;margin-bottom:14px;padding:14px;border:1px solid var(--border);border-radius:11px}
.admin{max-width:1250px;margin:auto;padding:30px 20px}.adminbar{background:#191a1e;color:#fff;border-radius:20px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.adminbar h2{color:var(--yellow)}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tab{border:0;background:#fff;padding:12px 16px;border-radius:10px;font-weight:800;white-space:nowrap}.tab.active{background:var(--yellow)}.admin-panel{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.table-wrap{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--border);vertical-align:top}th{background:#fafafa}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.pill.pending{background:#fff4c9}.pill.approved{background:#dff7ea;color:#147246}.pill.rejected{background:#ffe5e8;color:#a31d2a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{max-width:650px;width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:25px;position:relative}.close{position:absolute;right:15px;top:15px;border:0;background:#eee;border-radius:50%;width:35px;height:35px}
@media(max-width:850px){.nav{align-items:flex-start}.menu{display:block}.navlinks{display:none;width:100%;flex-direction:column;align-items:stretch}.navlinks.open{display:flex}.navlinks button{text-align:center}.nav{flex-wrap:wrap}.grid,.post-grid,.event-grid{grid-template-columns:1fr}.gallery-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.form-grid,.admin-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{min-height:620px}}
@media(max-width:480px){.brand{font-size:20px}.brand small{font-size:8px}.hero-inner{padding:60px 16px}.lion{font-size:60px}section{padding:55px 15px}.form-wrap{padding:20px}.gallery-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.statcard strong{font-size:30px}}
</style>
</head>

<header>
  <div class="nav">
    <a class="brand" href="#" onclick="showPage('home');return false;">
      🦁 <div><span>LEO</span> CLUB<small>Anuradhapura Walisinghe Harishchandra College</small></div>

    <button class="menu" onclick="toggleMenu()">☰</button>
    <div class="navlinks" id="navlinks">
      <button onclick="showPage('home')">Home</button>
      <button onclick="showPage('about')">About</button>
      <button onclick="showPage('events')">Events</button>
      <button onclick="showPage('gallery')">Gallery</button>
      <button onclick="showPage('register')">Register</button>
      <button onclick="showPage('adminLogin')">Admin</button>

</header>

<main id="app"></main>

<footer>
  🦁 <strong>Leo Club of Anuradhapura Walisinghe Harishchandra College</strong>
  <small>© 2026 • Together We Serve • Leadership • Friendship • Service</small>
</footer>

  <div class="modal-box">

    <div id="modalContent"></div>
  </div>

<script>
const SUPABASE_URL = "https://hxaqbnogyqzzfewgtdgd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_z1F0WgdC5WBtIFO9BGIpaw_dcjDyhXj";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SCHOOL = "Anuradhapura Walisinghe Harishchandra College";
let currentPage = "home";
let currentAdmin = null;
let membersCache = [];
let postsCache = [];
let eventsCache = [];
let galleryCache = [];

function toggleMenu(){document.getElementById("navlinks").classList.toggle("open")}
function closeMenu(){document.getElementById("navlinks").classList.remove("open")}
function showPage(page){currentPage=page;closeMenu();renderPage()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function notice(msg,type="error"){return `<div class="notice ${type}">${esc(msg)}</div>`}
function img(url,fallback="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?auto=format&fit=crop&w=1000&q=80"){return url||fallback}

async function renderPage(){
  const app=document.getElementById("app");
  if(currentPage==="home") return renderHome();
  if(currentPage==="about") return renderAbout();
  if(currentPage==="events") return renderEvents();
  if(currentPage==="gallery") return renderGallery();
  if(currentPage==="register") return renderRegister();
  if(currentPage==="adminLogin") return renderAdminLogin();
  if(currentPage==="admin") return renderAdmin();
  app.innerHTML="";
}

async function renderHome(){
  const app=document.getElementById("app");
  app.innerHTML=`
  <section class="hero">
    <div class="hero-inner">
      <div class="lion">🦁</div>
      <div class="badge">LEO CLUB • SCHOOL SERVICE ORGANIZATION</div>
      <h1>Serve. Lead. <span>Inspire.</span></h1>
      <p>Welcome to the Leo Club of <strong>${SCHOOL}</strong> — a community of young people growing through leadership, friendship and meaningful service.</p>
      <div class="actions"><button class="btn" onclick="showPage('register')">JOIN OUR CLUB →</button><button class="btn secondary" onclick="showPage('about')">EXPLORE CLUB</button></div>
    </div>
  </section>
  <section>
    <div class="section-head"><div class="eyebrow">Our Values</div><h2>Why Join Our Leo Club?</h2><p>Learn, serve and create memories with a team that believes every young person can make a difference.</p></div>
    <div class="grid">
      <div class="card"><div class="icon">🤝</div><h3>Friendship</h3><p>Meet new people, work as a team and build meaningful friendships.</p></div>
      <div class="card"><div class="icon">🌱</div><h3>Community Service</h3><p>Take part in projects that make our school and community better.</p></div>
      <div class="card"><div class="icon">🏆</div><h3>Leadership</h3><p>Develop confidence, teamwork, communication and leadership skills.</p></div>
    </div>
  </section>
  <section>
    <div class="stats">
      <div class="statcard"><strong id="homeMemberCount">—</strong><span>Registered Members</span></div>
      <div class="statcard"><strong id="homePostCount">—</strong><span>Published Posts</span></div>
      <div class="statcard"><strong id="homeEventCount">—</strong><span>Upcoming Events</span></div>
      <div class="statcard"><strong id="homeGalleryCount">—</strong><span>Gallery Photos</span></div>
    </div>
  </section>
  <section id="latestPosts">
    <div class="section-head"><div class="eyebrow">Stay Updated</div><h2>Latest Posts</h2><p>News, announcements and highlights from our club.</p></div>
    <div id="homePosts" class="post-grid"><div class="empty">Loading posts...</div></div>
  </section>
  <section>
    <div class="section-head"><div class="eyebrow">What's Next</div><h2>Upcoming Events</h2></div>
    <div id="homeEvents" class="event-grid"><div class="empty">Loading events...</div></div>
  </section>
  <section><div class="join"><h2>Ready to Make a Difference?</h2><p>Join the Leo Club of ${SCHOOL} and become part of something greater.</p><button class="btn" onclick="showPage('register')">REGISTER NOW →</button></div></section>`;
  loadHomeData();
}

async function loadHomeData(){
  const [m,p,e,g]=await Promise.all([
    db.from("members").select("id",{count:"exact",head:true}),
    db.from("posts").select("id",{count:"exact",head:true}).eq("published",true),
    db.from("events").select("id",{count:"exact",head:true}).eq("published",true).gte("event_date",new Date().toISOString().slice(0,10)),
    db.from("gallery").select("id",{count:"exact",head:true})
  ]);
  const set=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v??0};
  set("homeMemberCount",m.count??0);set("homePostCount",p.count??0);set("homeEventCount",e.count??0);set("homeGalleryCount",g.count??0);
  const {data:posts,error:pe}=await db.from("posts").select("*").eq("published",true).order("created_at",{ascending:false}).limit(6);
  const pc=document.getElementById("homePosts");
  if(pc) pc.innerHTML=pe?notice(pe.message):posts?.length?posts.map(postCard).join(""):`<div class="empty">No published posts yet.</div>`;
  const {data:events,error:ee}=await db.from("events").select("*").eq("published",true).gte("event_date",new Date().toISOString().slice(0,10)).order("event_date",{ascending:true}).limit(3);
  const ec=document.getElementById("homeEvents");
  if(ec) ec.innerHTML=ee?notice(ee.message):events?.length?events.map(eventCard).join(""):`<div class="empty">No upcoming events yet.</div>`;
}
function postCard(p){return `<article class="post-card">${p.image_url?`<img src="${esc(p.image_url)}" alt="" onerror="this.style.display='none'">`:""}<div class="post-body"><div class="meta">📰 ${new Date(p.created_at).toLocaleDateString()}</div><h3>${esc(p.title)}</h3><p>${esc(p.content).slice(0,180)}${String(p.content||"").length>180?"…":""}</p></div></article>`}
function eventCard(e){return `<article class="event-card">${e.image_url?`<img src="${esc(e.image_url)}" alt="" onerror="this.style.display='none'">`:""}<div class="event-body"><div class="meta">📅 ${esc(e.event_date)} ${e.event_time?`• ⏰ ${esc(e.event_time)}`:""}</div><h3>${esc(e.title)}</h3><p>📍 ${esc(e.location||"School premises")}</p><p>${esc(e.description||"")}</p></div></article>`}

function renderAbout(){
 document.getElementById("app").innerHTML=`<div class="page"><section><div class="section-head"><div class="eyebrow">About Us</div><h2>Leo Club of ${SCHOOL}</h2><p>A place for young people to learn, lead, serve and grow together.</p></div><div class="grid"><div class="card"><div class="icon">🎯</div><h3>Our Mission</h3><p>Encourage young people to develop leadership through practical service and teamwork.</p></div><div class="card"><div class="icon">🌟</div><h3>Our Vision</h3><p>Build a generation of confident, responsible and community-minded young leaders.</p></div><div class="card"><div class="icon">🦁</div><h3>Our Spirit</h3><p>Leadership, friendship and service — together we can create positive change.</p></div></div></section><section><div class="join"><h2>Be Part of Something Greater</h2><p>Whether you want to volunteer, lead a project or make new friends, there is a place for you here.</p><button class="btn" onclick="showPage('register')">JOIN THE CLUB →</button></div></section></div>`;
}

async function renderEvents(){
 document.getElementById("app").innerHTML=`<section><div class="section-head"><div class="eyebrow">Calendar</div><h2>Upcoming Events</h2><p>See what our club is working on next.</p></div><div id="eventsList" class="event-grid"><div class="empty">Loading...</div></div></section>`;
 const {data,error}=await db.from("events").select("*").eq("published",true).order("event_date",{ascending:true});
 document.getElementById("eventsList").innerHTML=error?notice(error.message):data?.length?data.map(eventCard).join(""):`<div class="empty">No events available.</div>`;
}
async function renderGallery(){
 document.getElementById("app").innerHTML=`<section><div class="section-head"><div class="eyebrow">Memories</div><h2>Club Gallery</h2><p>Moments from our service, projects and events.</p></div><div id="galleryList" class="gallery-grid"><div class="empty">Loading...</div></div></section>`;
 const {data,error}=await db.from("gallery").select("*").order("created_at",{ascending:false});
 document.getElementById("galleryList").innerHTML=error?notice(error.message):data?.length?data.map(g=>`<div class="gallery-item"><img src="${esc(g.image_url)}" alt="${esc(g.title||"Leo Club")}" onerror="this.parentElement.style.display='none'"></div>`).join(""):`<div class="empty">No gallery photos yet.</div>`;
}

function renderRegister(){
 document.getElementById("app").innerHTML=`<section><div class="section-head"><div class="eyebrow">Membership</div><h2>📝 Member Registration</h2><p>Fill in your details carefully. Your registration will be sent to the club administration.</p></div><div class="form-wrap"><div id="regMsg"></div><form id="registrationForm" onsubmit="submitRegistration(event)"><div class="form-grid">
 <div class="field"><label>Full Name *</label><input id="r_name" required></div>
 <div class="field"><label>Date of Birth *</label><input id="r_dob" type="date" required></div>
 <div class="field"><label>Gender</label><select id="r_gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Prefer not to say</option></select></div>
 <div class="field"><label>Mobile Number *</label><input id="r_phone" required></div>
 <div class="field"><label>WhatsApp Number</label><input id="r_whatsapp"></div>
 <div class="field"><label>Email</label><input id="r_email" type="email"></div>
 <div class="field full"><label>School / College *</label><input id="r_school" value="${SCHOOL}" required></div>
 <div class="field"><label>Grade / Course</label><input id="r_course"></div>
 <div class="field"><label>Leo Status</label><select id="r_leo"><option>New Member</option><option>Existing Leo</option></select></div>
 <div class="field"><label>Parent / Guardian Name</label><input id="r_guardian"></div>
 <div class="field"><label>Emergency Contact</label><input id="r_emergency"></div>
 <div class="field full"><label>Address</label><textarea id="r_address"></textarea></div>
 <div class="field full"><label class="check"><input id="r_consent" type="checkbox" required><span>I confirm that the information provided is correct.</span></label></div>
 </div><br><button class="btn" id="regBtn" type="submit">SUBMIT REGISTRATION →</button></form></div></section>`;
}
async function submitRegistration(ev){
 ev.preventDefault();const msg=document.getElementById("regMsg"),btn=document.getElementById("regBtn");btn.disabled=true;btn.textContent="SUBMITTING...";
 const payload={full_name:r("r_name"),date_of_birth:r("r_dob"),gender:r("r_gender"),phone:r("r_phone"),whatsapp:r("r_whatsapp"),email:r("r_email"),school:r("r_school"),course:r("r_course"),leo_status:r("r_leo"),guardian_name:r("r_guardian"),emergency_contact:r("r_emergency"),address:r("r_address"),status:"Pending"};
 const {data,error}=await db.from("members").insert(payload).select("id").single();
 if(error){msg.innerHTML=notice(error.message);btn.disabled=false;btn.textContent="SUBMIT REGISTRATION →";return}
 document.getElementById("registrationForm").reset();document.getElementById("r_school").value=SCHOOL;
 msg.innerHTML=notice("Registration successful! Your registration ID is #"+data.id,"success");window.scrollTo({top:0,behavior:"smooth"});btn.disabled=false;btn.textContent="SUBMIT REGISTRATION →";
}
function r(id){return document.getElementById(id).value.trim()}

function renderAdminLogin(){
 document.getElementById("app").innerHTML=`<section><div class="section-head"><div class="eyebrow">Restricted Area</div><h2>🔐 Admin Login</h2><p>Authorized administrators only.</p></div><div class="login-box"><h2>Leo Club Admin</h2><div id="loginMsg"></div><form onsubmit="loginAdmin(event)"><input id="a_email" type="email" placeholder="Admin Email" required><input id="a_password" type="password" placeholder="Password" required><button class="btn" style="width:100%" type="submit" id="loginBtn">LOGIN</button></form></div></section>`;
}
async function loginAdmin(ev){
 ev.preventDefault();const btn=document.getElementById("loginBtn"),msg=document.getElementById("loginMsg");btn.disabled=true;btn.textContent="LOGIN...";
 const {data,error}=await db.auth.signInWithPassword({email:r("a_email"),password:document.getElementById("a_password").value});
 if(error){msg.innerHTML=notice(error.message);btn.disabled=false;btn.textContent="LOGIN";return}
 const {data:ok,error:oe}=await db.rpc("is_admin");
 if(oe||!ok){await db.auth.signOut();msg.innerHTML=notice("This account is not an authorized Leo Club admin.");btn.disabled=false;btn.textContent="LOGIN";return}
 currentAdmin=data.user;showPage("admin");
}
async function logout(){await db.auth.signOut();currentAdmin=null;showPage("home")}

async function renderAdmin(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){showPage("adminLogin");return}
 const {data:ok}=await db.rpc("is_admin");if(!ok){await db.auth.signOut();showPage("adminLogin");return}
 currentAdmin=user;
 document.getElementById("app").innerHTML=`<div class="admin"><div class="adminbar"><div><h2>🦁 Admin Dashboard</h2><small>${esc(user.email)}</small></div><button class="btn small" onclick="logout()">Logout</button></div>
 <div class="tabs"><button class="tab active" onclick="adminTab('overview',this)">📊 Overview</button><button class="tab" onclick="adminTab('members',this)">👥 Members</button><button class="tab" onclick="adminTab('posts',this)">📰 Posts</button><button class="tab" onclick="adminTab('events',this)">📅 Events</button><button class="tab" onclick="adminTab('gallery',this)">📸 Gallery</button></div>
 <div id="adminContent" class="admin-panel">Loading...</div></div>`;
 adminTab("overview",document.querySelector(".tab"));
}
async function adminTab(tab,el){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active");const c=document.getElementById("adminContent");if(tab==="overview")return adminOverview(c);if(tab==="members")return adminMembers(c);if(tab==="posts")return adminPosts(c);if(tab==="events")return adminEvents(c);if(tab==="gallery")return adminGallery(c)}
async function adminOverview(c){
 const [m,p,e,g]=await Promise.all([db.from("members").select("id,status"),db.from("posts").select("id"),db.from("events").select("id"),db.from("gallery").select("id")]);
 c.innerHTML=`<h2>Dashboard Overview</h2><br><div class="stats"><div class="statcard"><strong>${m.data?.length||0}</strong><span>Members</span></div><div class="statcard"><strong>${m.data?.filter(x=>x.status==="Pending").length||0}</strong><span>Pending</span></div><div class="statcard"><strong>${p.data?.length||0}</strong><span>Posts</span></div><div class="statcard"><strong>${e.data?.length||0}</strong><span>Events</span></div></div><br><p>Use the tabs above to manage club content.</p>`;
}
async function adminMembers(c){
 const {data,error}=await db.from("members").select("*").order("created_at",{ascending:false});membersCache=data||[];
 c.innerHTML=`<h2>👥 Members</h2><br><input class="search" placeholder="🔍 Search members..." oninput="filterAdminMembers(this.value)"><div id="memberTable" class="table-wrap">${memberTable(membersCache)}</div>`;
}
function memberTable(list){if(!list.length)return `<div class="empty">No members found.</div>`;return `<table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>School</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(m=>`<tr><td>#${m.id}</td><td><strong>${esc(m.full_name)}</strong><br><small>${esc(m.email||"")}</small></td><td>${esc(m.phone||"")}</td><td>${esc(m.school||"")}</td><td><span class="pill ${(m.status||"Pending").toLowerCase()}">${esc(m.status||"Pending")}</span></td><td><button class="btn small" onclick="viewMember(${m.id})">View</button> <button class="btn small" onclick="setMemberStatus(${m.id},'Approved')">Approve</button></td></tr>`).join("")}</tbody></table>`}
function filterAdminMembers(q){q=q.toLowerCase();document.getElementById("memberTable").innerHTML=memberTable(membersCache.filter(m=>JSON.stringify(m).toLowerCase().includes(q)))}
async function setMemberStatus(id,status){const {error}=await db.from("members").update({status}).eq("id",id);if(error)return alert(error.message);adminMembers(document.getElementById("adminContent"))}
function viewMember(id){const m=membersCache.find(x=>x.id===id);if(!m)return;document.getElementById("modalContent").innerHTML=`<h2>Member Details</h2><br>${Object.entries(m).filter(([k])=>k!=="id").map(([k,v])=>`<p><strong>${esc(k.replaceAll("_"," "))}:</strong> ${esc(v??"")}</p>`).join("")}`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}

async function adminPosts(c){
 const {data,error}=await db.from("posts").select("*").order("created_at",{ascending:false});postsCache=data||[];
 c.innerHTML=`<h2>📰 Posts</h2><br><form onsubmit="addPost(event)"><div class="admin-grid"><div class="field"><label>Post Title *</label><input id="p_title" required></div><div class="field"><label>Image URL</label><input id="p_image" placeholder="https://..."></div><div class="field" style="grid-column:1/-1"><label>Content *</label><textarea id="p_content" required></textarea></div><div class="field"><label class="check"><input id="p_published" type="checkbox" checked><span>Publish on Home page</span></label></div></div><br><button class="btn" type="submit">➕ ADD POST</button></form><hr style="margin:28px 0;border:0;border-top:1px solid var(--border)"><h3>All Posts</h3><div class="table-wrap">${postsCache.length?`<table><thead><tr><th>Title</th><th>Published</th><th>Date</th><th>Action</th></tr></thead><tbody>${postsCache.map(p=>`<tr><td><strong>${esc(p.title)}</strong></td><td>${p.published?"✅":"❌"}</td><td>${new Date(p.created_at).toLocaleDateString()}</td><td><button class="btn danger small" onclick="deletePost(${p.id})">Delete</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No posts yet.</div>`}</div>`;
}
async function addPost(ev){ev.preventDefault();const {error}=await db.from("posts").insert({title:r("p_title"),content:r("p_content"),image_url:r("p_image")||null,published:document.getElementById("p_published").checked});if(error){alert(error.message);return}alert("Post added successfully!");adminPosts(document.getElementById("adminContent"))}
async function deletePost(id){if(!confirm("Delete this post?"))return;const {error}=await db.from("posts").delete().eq("id",id);if(error)return alert(error.message);adminPosts(document.getElementById("adminContent"))}

async function adminEvents(c){
 const {data}=await db.from("events").select("*").order("event_date",{ascending:true});eventsCache=data||[];
 c.innerHTML=`<h2>📅 Events</h2><br><form onsubmit="addEvent(event)"><div class="admin-grid"><div class="field"><label>Title *</label><input id="e_title" required></div><div class="field"><label>Date *</label><input id="e_date" type="date" required></div><div class="field"><label>Time</label><input id="e_time" type="time"></div><div class="field"><label>Location</label><input id="e_location"></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea id="e_desc"></textarea></div><div class="field"><label>Image URL</label><input id="e_image"></div><div class="field"><label class="check"><input id="e_published" type="checkbox" checked><span>Publish event</span></label></div></div><br><button class="btn" type="submit">➕ ADD EVENT</button></form><hr style="margin:28px 0;border:0;border-top:1px solid var(--border)"><h3>All Events</h3><div class="table-wrap">${eventsCache.length?`<table><thead><tr><th>Event</th><th>Date</th><th>Location</th><th>Action</th></tr></thead><tbody>${eventsCache.map(e=>`<tr><td>${esc(e.title)}</td><td>${esc(e.event_date)}</td><td>${esc(e.location||"")}</td><td><button class="btn danger small" onclick="deleteEvent(${e.id})">Delete</button></td></tr>`).join("")}</tbody></table>`:`<div class="empty">No events yet.</div>`}</div>`;
}
async function addEvent(ev){ev.preventDefault();const {error}=await db.from("events").insert({title:r("e_title"),event_date:r("e_date"),event_time:r("e_time")||null,location:r("e_location"),description:r("e_desc"),image_url:r("e_image")||null,published:document.getElementById("e_published").checked});if(error)return alert(error.message);alert("Event added successfully!");adminEvents(document.getElementById("adminContent"))}
async function deleteEvent(id){if(!confirm("Delete this event?"))return;const {error}=await db.from("events").delete().eq("id",id);if(error)return alert(error.message);adminEvents(document.getElementById("adminContent"))}

async function adminGallery(c){
 const {data}=await db.from("gallery").select("*").order("created_at",{ascending:false});galleryCache=data||[];
 c.innerHTML=`<h2>📸 Gallery</h2><br><form onsubmit="addGallery(event)"><div class="admin-grid"><div class="field"><label>Photo Title</label><input id="g_title"></div><div class="field"><label>Image URL *</label><input id="g_image" required placeholder="https://..."></div></div><br><button class="btn" type="submit">➕ ADD PHOTO</button></form><hr style="margin:28px 0;border:0;border-top:1px solid var(--border)"><div class="gallery-grid">${galleryCache.length?galleryCache.map(g=>`<div class="gallery-item"><img src="${esc(g.image_url)}"><div style="padding:12px"><strong>${esc(g.title||"Photo")}</strong><br><button class="btn danger small" onclick="deleteGallery(${g.id})">Delete</button></div></div>`).join(""):`<div class="empty">No photos yet.</div>`}</div>`;
}
async function addGallery(ev){ev.preventDefault();const {error}=await db.from("gallery").insert({title:r("g_title"),image_url:r("g_image")});if(error)return alert(error.message);alert("Photo added successfully!");adminGallery(document.getElementById("adminContent"))}
async function deleteGallery(id){if(!confirm("Delete this photo?"))return;const {error}=await db.from("gallery").delete().eq("id",id);if(error)return alert(error.message);adminGallery(document.getElementById("adminContent"))}

db.auth.getSession().then(({data})=>{currentAdmin=data.session?.user||null});
renderPage();
</script>
</body>
          </html>
